[project]
name = "ac209a"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pandas",
    "openpyxl",
    "pyyaml",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ac209a"]

[dependency-groups]
dev = [
    "bokeh",
    "ipykernel",
    "ipympl>=0.10.0",
    "nbformat",
    "plotly",
]
